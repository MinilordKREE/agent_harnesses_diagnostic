# Exploratory run config. Validated by ahd.core.config.RunConfig (unknown keys are rejected).
schema_version: 1
name: example
kind: exploratory          # exploratory | confirmatory
seed: 0                    # replicate id; included in every cache key and ledger row
# require_clean_tree: omitted -> false for exploratory, true for confirmatory
llm:
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  temperature: 0.0
  max_tokens: 256
  thinking: false          # true -> DeepSeek thinking mode; temperature is then not sent
  reasoning_effort: null   # none|minimal|low|medium|high|xhigh|max; only sent when thinking is true
  timeout_s: 120.0
  cache_dir: .cache/ahd/llm
  retry:
    max_attempts: 5
    initial_delay_s: 1.0
    max_delay_s: 30.0
    multiplier: 2.0
    jitter_s: 1.0
    total_timeout_s: 300.0
judge:
  model: deepseek-v4-pro     # the measurement instrument: fixed, temperature 0, cached
  temperature: 0.0
  max_tokens: 8192
  timeout_s: 300.0
  use_cache: true
  thinking: false
tasks:
  dataset_id: RUC-AIBOX/Evo-Bench
  revision: 46bf7acf5c76250541c44d3794c38bb2e5ecba35
  split: validation
  sources: [browsecomp, hle, gdpval, claw_eval]   # apex is loaded but excluded
  n: null                    # stratified subsample size by source; null = all
pricing_path: configs/pricing.yaml
runs_root: runs
