# EXPERIMENT E0 - calibration (Study 0). Frozen before running; numbers are filled into
# data/E0/ and docs/experiments/E0_REPORT.md by scripts/e0_report.py after the runs.
# The decision rules below are applied mechanically by ahd.experiments.report; they are the
# owner's text verbatim.
schema_version: 1
experiment: E0
role: calibration
policy:
  model: deepseek-v4-flash
  temperature: 1.0
  reasoning_effort: max
judge:
  model: deepseek-v4-pro
  temperature: 0.0
  cached: true            # retry salt as in M3.1
mock_today: "2026-03-02"
replay:
  k: 3
  max_candidates: 5
  economize: true
reference_max_attempts: 5
workers: 4                # unless E0a shows otherwise
config: configs/runs/e0.yaml
runs_root: runs/E0
owner_budget_usd: null    # TODO-owner: D4 needs this before E0b runs
sources: [browsecomp, hle, gdpval, claw_eval]
E0a:
  per_source: 5           # stratified sample from validation, seed 0 -> 20 tasks
  seed: 0
  replicates: benchmark   # 1 replicate; Claw's 3 trials as the benchmark defines
  diagnosis_on_failures: [reference, genuineness, alignment, replay, signal, leakage]
E0b:
  B1_baseline: {split: validation, tasks: all, passes: 2}
  B2_heldout: {split: evaluation, per_source: 30, seed: 0, passes: 2, frozen: experiments/heldout_v1.json}
  B3_failure_mining: every failed rollout of B1
  B4_references: {max_attempts: 5, genuineness: true}
  B5_replay: {k: 3, max_candidates: 5, economize: true, full_arms_subset: {n: 30, seed: 0, stratified_by: source}}
  B6_clusters: {vocabulary: configs/prompts/diagnosis/causes.yaml, corruption_seed: 0, leakage: true}
  B7_judge_calibration: {n_artifacts: 50, self_consistency: cache_bypass, cross_judge: deepseek-v4-flash, released_labels: report_if_any}
  B8_render: {clusters_per_source: 3, arms: [reference, system, corrupt_where_near, corrupt_where_far, corrupt_why, corrupt_how, shuffled]}
decision_rules:
  D1: >
    Source enters E2 iff: seed pass rate on validation in [0.10, 0.90] (headroom both ways)
    AND per-source A/A |delta| <= 5 points AND >= 6 clusters with >= 2 members.
  D2: >
    A cluster is E2-primary iff >= 2 members, >= 1 genuine reference, oracle step validated
    (deterministic) or manifestation-based (stochastic), and near+far+why+how+all all
    feasible. Singletons and clusters failing any condition form the secondary pool.
  D3: >
    Search stays in E2 only if D1 holds AND its A/A band is not wider than the other
    sources' by more than 2x; otherwise Search is reported separately as descriptive.
  D4: >
    Replicates in E2: k=3 if projected E2 cost (from cost.csv, 8 arms x N primary clusters
    x k) <= owner budget entered in spec.yaml before running; else k=2; N is all primary
    clusters, never topped up.
  D5: >
    Held-out size: 30/source unless the A/A band on held-out exceeds 5 points, in which
    case 45/source (re-sampled from the same frozen seed, superset).
  D6: >
    Judge: if self-consistency < 0.90, the E2 primary outcome uses a 2-of-3 judge vote
    (cost recorded); if Flash-vs-Pro agreement < 0.80, report both judges in E2.
thresholds:            # the numbers inside the rules, as data
  pass_rate_min: 0.10
  pass_rate_max: 0.90
  aa_band_max_points: 5.0
  min_clusters_with_two: 6
  search_band_ratio_max: 2.0
  heldout_per_source: 30
  heldout_per_source_wide: 45
  judge_self_consistency_min: 0.90
  judge_cross_agreement_min: 0.80
  e2_arms: 8
